$kind: http-request
url: "{{baseUrl}}/api/courses"
method: POST
body:
  type: json
  content: '{ "code": "STU1", "title": "Student Attempt", "creditHours": 2 }'
auth:
  type: bearer
  credentials:
    token: "{{studentToken}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status is 403\", () => pm.response.to.have.status(403));\r

      pm.test(\"Body is empty or problem details with 403\", () => {\r

      \    const t = pm.response.text();\r

      \    pm.expect(t === \"\" || JSON.parse(t).status === 403).to.be.true;\r

      });"
    language: text/javascript
order: 12000

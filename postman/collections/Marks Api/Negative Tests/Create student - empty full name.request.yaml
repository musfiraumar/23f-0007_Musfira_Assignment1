    code: "pm.test(\"Status is 400\", () => pm.response.to.have.status(400));\r

      pm.test(\"Errors name fullName\", () => pm.expect(pm.response.json().errors).to.have.property(\"fullName\"));"
    language: text/javascript
order: 2000

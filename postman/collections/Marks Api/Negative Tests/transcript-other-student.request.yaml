$kind: http-request
url: "{{baseUrl}}/api/students/{{saraId}}/transcript"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{studentToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status is 403", () => pm.response.to.have.status(403));
    language: text/javascript
order: 16000

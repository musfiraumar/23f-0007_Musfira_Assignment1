$kind: http-request
url: "{{baseUrl}}/api/students"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: "pm.test(\"Status is 401\", () => pm.response.to.have.status(401));\r

      pm.test(\"Server asks for a bearer token\", () => pm.expect(pm.response.headers.has(\"WWW-Authenticate\")).to.be.true);"
    language: text/javascript
order: 10000

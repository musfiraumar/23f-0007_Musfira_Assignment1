$kind: http-request
url: "{{baseUrl}}/api/courses"
method: POST
body:
  type: json
  content: '{ "code": "CS401", "title": "Dup", "creditHours": 3 }'
scripts:
  - type: afterResponse
    code: "pm.test(\"Status is 409\", () => pm.response.to.have.status(409));\r

      pm.test(\"Title is Duplicate course\", () => pm.expect(pm.response.json().title).to.eql(\"Duplicate course\"));"
    language: text/javascript
order: 11000

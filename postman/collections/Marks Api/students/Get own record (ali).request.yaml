$kind: http-request
url: "{{baseUrl}}/api/students/{{aliId}}"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status is 200\", () => pm.response.to.have.status(200));\r

      pm.test(\"Student sees his own record\", () => {\r

      \    const j = pm.response.json();\r

      \    pm.expect(j.id).to.eql(Number(pm.collectionVariables.get(\"aliId\")));\r

      \    pm.expect(j.fullName).to.eql(\"Ali Raza\");\r

      });"
    language: text/javascript
order: 6000

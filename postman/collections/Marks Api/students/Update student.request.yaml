$kind: http-request
url: "{{baseUrl}}/api/students/{{studentId}}"
method: PUT
body:
  type: json
  content: '{ "registrationNo": "SMOKE-001", "fullName": "Test One Updated", "email": "test.one@example.com" }'
scripts:
  - type: afterResponse
    code: "pm.test(\"Status is 200\", () => pm.response.to.have.status(200));\r

      pm.test(\"Name was updated\", () => {\r

      \    const j = pm.response.json();\r

      \    pm.expect(j.id).to.eql(Number(pm.collectionVariables.get(\"studentId\")));\r

      \    pm.expect(j.fullName).to.eql(\"Test One Updated\");\r

      });"
    language: text/javascript
order: 5000

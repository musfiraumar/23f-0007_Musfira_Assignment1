$kind: http-request
url: "{{baseUrl}}/api/courses"
method: GET
scripts:
  - type: afterResponse
    code: "// 3 list-courses\r

      pm.test(\"Status is 200\", () => pm.response.to.have.status(200));\r

      pm.test(\"Body has the paged shape\", () => {\r

      \    const j = pm.response.json();\r

      \    pm.expect(j).to.have.all.keys(\"items\", \"page\", \"pageSize\", \"totalCount\");\r

      \    pm.expect(j.items).to.be.an(\"array\");\r

      });"
    language: text/javascript
order: 3000
